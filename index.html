<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- ✅ Яндекс.Карты API с ключом -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=d1f3a395-b202-464d-b3e0-ff6dc1df2e05&lang=ru_RU" type="text/javascript"></script>

    <script>
        // Читаем координаты из URL
        const params = new URLSearchParams(window.location.search);
        const lat = parseFloat(params.get('lat')) || 55.75;
        const lon = parseFloat(params.get('lon')) || 37.62;

        // Ждём загрузку API Яндекс.Карт
        ymaps.ready(init);

        function init() {
            // Создаём карту
            const myMap = new ymaps.Map("map", {
                center: [lat, lon],   // порядок: [широта, долгота]
                zoom: 17,
                controls: [
                    'zoomControl',          // кнопки +/-
                    'geolocationControl',   // кнопка "моё местоположение"
                    'fullscreenControl'     // кнопка "на весь экран"
                ]
            });

            // Красная метка на найденном адресе
            const myPlacemark = new ymaps.Placemark([lat, lon], {
                balloonContentHeader: 'Адрес найден',
                balloonContentBody: `${lat.toFixed(6)}, ${lon.toFixed(6)}`,
                hintContent: 'Найденный адрес'
            }, {
                preset: 'islands#redIcon'
            });

            myMap.geoObjects.add(myPlacemark);
            myPlacemark.balloon.open();

            // Настройки Web App Telegram
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.setHeaderColor('#ffffff');
                window.Telegram.WebApp.setBackgroundColor('#ffffff');
            }
        }
    </script>
</body>
</html>
